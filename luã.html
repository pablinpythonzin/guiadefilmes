<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Popcorn Hub - Encontre, avalie e salve seus filmes favoritos.">
    <title>Popcorn Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-content">
            <h1 class="logo">🍿 Popcorn Hub</h1>

            <form class="search-form" role="search">
                <label for="movie-search" class="sr-only">
                    Buscar filmes
                </label>

                <input
                    type="search"
                    id="movie-search"
                    name="search"
                    placeholder="Buscar filmes..."
                    autocomplete="off"
                >
            </form>

            <nav class="genre-filters" aria-label="Filtros por gênero">
                <button type="button" class="genre-btn active" data-genre="all">
                    Todos
                </button>
                <button type="button" class="genre-btn" data-genre="action">
                    Ação
                </button>
                <button type="button" class="genre-btn" data-genre="comedy">
                    Comédia
                </button>
                <button type="button" class="genre-btn" data-genre="drama">
                    Drama
                </button>
                <button type="button" class="genre-btn" data-genre="sci-fi">
                    Sci-Fi
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="movies-section" aria-labelledby="movies-title">
            <div class="section-header">
                <h2 id="movies-title">Filmes</h2>
            </div>

            <div id="movie-grid" class="movie-grid">
                <!-- Os cards dos filmes serão inseridos pelo JavaScript -->
            </div>
        </section>

        <section
            id="favorites-section"
            class="favorites-section"
            aria-labelledby="favorites-title"
        >
            <div class="section-header">
                <h2 id="favorites-title">❤️ Meus Favoritos</h2>
            </div>

            <div id="favorites-grid" class="movie-grid">
                <!-- Os filmes favoritos serão inseridos pelo JavaScript -->
            </div>

            <p id="empty-favorites" class="empty-message">
                Você ainda não adicionou nenhum filme aos favoritos.
            </p>
        </section>
    </main>

    <!-- Modal de detalhes do filme -->
    <div
        id="movie-modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-hidden="true"
    >
        <div class="modal-overlay" data-close-modal></div>

        <div class="modal-content">
            <button
                type="button"
                class="modal-close"
                aria-label="Fechar detalhes do filme"
                data-close-modal
            >
                &times;
            </button>

            <div class="trailer-container">
                <iframe
                    id="movie-trailer"
                    src=""
                    title="Trailer do filme"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                ></iframe>
            </div>

            <div class="movie-details">
                <div class="movie-info">
                    <h2 id="modal-title">Título do filme</h2>

                    <div class="movie-meta">
                        <span id="modal-rating">⭐ 0.0</span>
                        <span id="modal-age-rating">Classificação: Livre</span>
                    </div>

                    <p id="modal-synopsis">
                        Sinopse do filme.
                    </p>
                </div>

                <div class="movie-actions" aria-label="Ações do filme">
                    <!-- Favoritar -->
                    <button
                        type="button"
                        class="action-btn"
                        id="favorite-btn"
                        title="Favoritar"
                        aria-label="Favoritar filme"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        <span>Favoritar</span>
                    </button>

                    <!-- Visto / Quero Ver -->
                    <button
                        type="button"
                        class="action-btn"
                        id="watched-btn"
                        title="Marcar como visto"
                        aria-label="Marcar filme como visto"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <span>Visto</span>
                    </button>

                    <!-- Like -->
                    <button
                        type="button"
                        class="action-btn"
                        id="like-btn"
                        title="Curtir"
                        aria-label="Curtir filme"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v9h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/>
                            <path d="M7 11H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h3"/>
                        </svg>
                        <span>Like</span>
                    </button>

                    <!-- Dislike -->
                    <button
                        type="button"
                        class="action-btn"
                        id="dislike-btn"
                        title="Não gostei"
                        aria-label="Não gostei do filme"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V4H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3z"/>
                            <path d="M17 13h3a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/>
                        </svg>
                        <span>Dislike</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>
            &copy; 2026 Popcorn Hub. Desenvolvido por
            <strong>Luã</strong>, <strong>Matheus</strong> e <strong>Pablo</strong>.
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<div class="movie-card">
    <img src="images/imagem.jpg" alt="Filme">
    
    <div class="movie-card-content">
        <h3 class="movie-card-title">Popcorn Hub</h3>
    </div>
</div>
